services:
  mysql:
    image: mysql:8.0
    container_name: test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_DATABASE: test_db
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
    volumes:
      - ./dockerfiles/init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./dockerfiles/seed-mysql.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - test-network

  postgres:
    image: postgres:15-alpine
    container_name: test-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./dockerfiles/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./dockerfiles/seed-postgres.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - test-network

  mssql:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: test-mssql
    environment:
      SA_PASSWORD: TestPassword123!
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ./dockerfiles/init-sqlserver.sql:/tmp/init.sql
      - ./dockerfiles/seed-sqlserver.sql:/tmp/seed.sql
      - ./dockerfiles/entrypoint-sqlserver.sh:/entrypoint.sh
      - ./mssql_test_data:/var/opt/mssql/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "TestPassword123!",
          "-C",
          "-Q",
          "SELECT 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - test-network
    entrypoint: /bin/bash /entrypoint.sh

volumes:
  mysql_test_data:
  postgres_test_data:
  mssql_test_data:

networks:
  test-network:
    driver: bridge
