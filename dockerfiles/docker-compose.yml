version: "3.8"

services:
  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: db-connector-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_DATABASE: test_db
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
    volumes:
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./seed-mysql.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-connector-network

  # PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: db-connector-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./seed-postgres.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-connector-network

  # SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db-connector-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "TestPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ./init-sqlserver.sql:/tmp/init.sql
      - ./seed-sqlserver.sql:/tmp/seed.sql
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "TestPassword123!",
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-connector-network
    # Note: SQL Server needs to run init scripts differently (see Makefile)

  # SQLite (not a container, but included for completeness)
  # SQLite uses file-based storage, no container needed
  # Tests will use tests/integration/fixtures/test.db

volumes:
  mysql_data:
  postgres_data:
  sqlserver_data:

networks:
  db-connector-network:
    driver: bridge
