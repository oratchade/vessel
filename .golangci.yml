version: "2"
run:
  tests: true
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gocritic
    - revive
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - unparam
    - bodyclose
    - cyclop
    - dupl
    - gocyclo
    - goconst
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goheader
    - gosec
    - nolintlint
    - unconvert
    - wrapcheck
    - whitespace
    - testableexamples
    - tparallel
    - loggercheck
    - sqlclosecheck
    - tagalign
    - iface
    - importas
    - errorlint
    - contextcheck
    - recvcheck
    - spancheck
    - promlinter
    - fatcontext
    - forbidigo
    - makezero
    - testpackage
  settings:
    misspell:
      locale: US
    revive:
      severity: warning
      rules:
        - name: indent-error-flow
        - name: var-naming
        - name: blank-imports
        - name: dot-imports
        - name: line-length-limit
          arguments:
            - 120
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: error return value not checked.*(Close|Log|Print).*
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
