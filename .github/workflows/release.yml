name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  setup-tools:
    name: Setup Tools Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.x"
          cache: true

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('**/go.mod') }}
          restore-keys: go-tools-${{ runner.os }}-

      - name: Download Go dependencies
        run: go mod download

      - name: Install Go tools
        run: make tools

  validate-release:
    name: Validate Release
    needs: [ setup-tools ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.x"
          cache: true

      - name: Restore Go tools cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('**/go.mod') }}
          restore-keys: go-tools-${{ runner.os }}-

      - name: Run full test suite
        run: make coverage

      - name: Verify package quality
        run: make lint

  create-release:
    name: Create GitHub Release
    needs: validate-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag -l --sort=-version:refname | grep -v $VERSION | head -1)

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-decorate)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --no-decorate)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            # Release ${{ steps.version.outputs.version }}

            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ```bash
            go get -u tounilab.com/fabric@${{ steps.version.outputs.version }}
            ```

            ## Documentation

            See [pkg.go.dev](https://pkg.go.dev/tounilab.com/fabric@${{ steps.version.outputs.version }}) for full API documentation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
