name: Module Health

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Check module health daily
    - cron: "0 3 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  go-get-check:
    name: Go Get Availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.x"

      - name: Extract module path
        id: module
        run: |
          MODULE=$(head -1 go.mod | awk '{print $2}')
          echo "module=${MODULE}" >> $GITHUB_OUTPUT
          echo "📦 Module: ${MODULE}"

      - name: Verify module can be fetched
        run: |
          # Test that the module can be fetched
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          go mod init test-module
          go get -d ${{ steps.module.outputs.module }}@latest 2>&1 || {
            echo "⚠️  Warning: Module not fetchable via go get, but this is expected for private modules"
          }
          cd -
          rm -rf "$TEMP_DIR"
          echo "✅ Module availability check completed"

  mod-graph:
    name: Module Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify module requirements
        run: |
          echo "📊 Module dependency analysis:"
          go mod graph | head -20
          echo ""
          echo "✅ Dependency graph valid"

  go-report-metrics:
    name: Go Code Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.x"
          cache: true

      - name: Generate code metrics
        run: |
          mkdir -p out/metrics

          # Lines of code
          echo "📈 Code Metrics" > out/metrics/summary.txt
          echo "==================" >> out/metrics/summary.txt
          echo "" >> out/metrics/summary.txt

          # Total lines of code
          TOTAL_LOC=$(find . -name "*.go" -not -path "./vendor/*" -not -path "./third_party/*" | xargs wc -l | tail -1 | awk '{print $1}')
          echo "Total Lines of Code: $TOTAL_LOC" >> out/metrics/summary.txt

          # Number of packages
          NUM_PACKAGES=$(go list ./... | wc -l)
          echo "Number of Packages: $NUM_PACKAGES" >> out/metrics/summary.txt

          # Number of test files
          NUM_TESTS=$(find . -name "*_test.go" -not -path "./vendor/*" | wc -l)
          echo "Test Files: $NUM_TESTS" >> out/metrics/summary.txt

          echo "" >> out/metrics/summary.txt
          echo "✅ Metrics generated"
          cat out/metrics/summary.txt

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: out/metrics/

  doc-coverage:
    name: Documentation Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.x"

      - name: Check exported API documentation
        run: |
          mkdir -p out/docs
          echo "# API Documentation Coverage" > out/docs/coverage.md
          echo "" >> out/docs/coverage.md

          # Check which exported functions have documentation
          go doc -all ./db/v1 | grep -E "^func|^type" | head -20 >> out/docs/coverage.md

          echo "✅ Documentation coverage checked"

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: doc-coverage
          path: out/docs/

  module-quality:
    name: Module Quality Assessment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.x"
          cache: true

      - name: Check module health
        run: |
          mkdir -p out/quality

          echo "🔍 Module Quality Check" > out/quality/assessment.txt
          echo "======================" >> out/quality/assessment.txt
          echo "" >> out/quality/assessment.txt

          # Go version check
          GO_VERSION=$(grep "^go " go.mod | awk '{print $2}')
          echo "✅ Go Version: $GO_VERSION" >> out/quality/assessment.txt

          # Module path validation
          MODULE=$(head -1 go.mod | awk '{print $2}')
          echo "✅ Module Path: $MODULE" >> out/quality/assessment.txt

          # License check
          if [ -f "LICENSE.md" ] || [ -f "LICENSE" ]; then
            echo "✅ License file present" >> out/quality/assessment.txt
          else
            echo "⚠️  License file missing" >> out/quality/assessment.txt
          fi

          # README check
          if [ -f "README.md" ]; then
            echo "✅ README present" >> out/quality/assessment.txt
          else
            echo "⚠️  README missing" >> out/quality/assessment.txt
          fi

          # Go.mod organization check
          NUM_REQUIRES=$(grep "^\s*require" go.mod | wc -l)
          echo "ℹ️  Direct dependencies: $NUM_REQUIRES" >> out/quality/assessment.txt

          echo "" >> out/quality/assessment.txt
          echo "✅ Quality assessment complete"
          cat out/quality/assessment.txt

      - name: Upload quality assessment
        uses: actions/upload-artifact@v4
        with:
          name: module-quality
          path: out/quality/
